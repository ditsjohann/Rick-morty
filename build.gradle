plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file("src/main/resources/mayhem.accesswidener")

    runs {
        // Dev-only: boots straight into the "autotest" world and screenshots staged scenes (see AutoTest.java).
        autotest {
            client()
            name "Autotest Client"
            vmArg "-Dmayhem.autotest=true"
            programArgs "--quickPlaySingleplayer", "autotest", "--width", "960", "--height", "540"
            runDir "run"
        }
    }

    mods {
        "mayhem" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Allow piping console commands into the dev server (used for automated smoke tests).
tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}
